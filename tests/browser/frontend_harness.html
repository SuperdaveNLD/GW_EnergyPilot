<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>GW EnergyPilot frontend stability harness</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #061126;
    }
    #ha-scroll {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }
    gw-energypilot-panel { display: block; min-height: 100%; }
  </style>
</head>
<body>
  <div id="ha-scroll"></div>
  <script type="module">
    const ENTRY_ID = "test_entry";
    const ENTITY_KEYS = [
      "pv_total_power", "total_load_power", "battery_power",
      "meter_total_power_fast", "total_inverter_power", "ac_active_power",
      "pv1_power", "pv2_power", "pv3_power", "pv4_power",
      "battery_soc", "battery_soh", "battery_voltage", "battery_current",
      "battery_max_cell_temperature", "bms_package_temperature",
      "inverter_radiator_temperature", "bms_max_charge_current",
      "bms_max_discharge_current", "meter_l1_active_power",
      "meter_l2_active_power", "meter_l3_active_power", "meter_l1_voltage",
      "meter_l2_voltage", "meter_l3_voltage", "meter_l1_current",
      "meter_l2_current", "meter_l3_current", "ems_mode", "ems_setpoint",
      "target_power", "control_command", "automatic_control", "optimize_now",
      "manual_mode", "manual_power", "control_strategy",
      "grid_energy_imported_today", "grid_energy_exported_today",
      "grid_energy_import_total", "grid_energy_export_total",
      "battery_charge_energy_today", "battery_discharge_energy_today",
      "battery_charge_energy_total", "battery_discharge_energy_total",
      "emhass_minimum_soc", "emhass_maximum_soc", "maximum_export",
      "pause_battery", "maximum_charge", "battery_auto",
    ];

    const stateValues = {
      pv_total_power: 4800,
      total_load_power: 2500,
      battery_power: -1200,
      meter_total_power_fast: 1100,
      total_inverter_power: 3600,
      ac_active_power: 3550,
      pv1_power: 1600,
      pv2_power: 1600,
      pv3_power: 1600,
      pv4_power: 0,
      battery_soc: 54,
      battery_soh: 99,
      battery_voltage: 384.2,
      battery_current: -3.1,
      battery_max_cell_temperature: 25.3,
      bms_package_temperature: 24.8,
      inverter_radiator_temperature: 31.4,
      bms_max_charge_current: 40,
      bms_max_discharge_current: 40,
      meter_l1_active_power: 360,
      meter_l2_active_power: 370,
      meter_l3_active_power: 370,
      meter_l1_voltage: 231.2,
      meter_l2_voltage: 230.9,
      meter_l3_voltage: 231.4,
      meter_l1_current: 1.6,
      meter_l2_current: 1.6,
      meter_l3_current: 1.6,
      ems_mode: 11,
      ems_setpoint: 1200,
      target_power: -1200,
      control_command: "battery_charge",
      automatic_control: "on",
      optimize_now: "unknown",
      manual_mode: "1",
      manual_power: 0,
      control_strategy: "battery",
      grid_energy_imported_today: 3.2,
      grid_energy_exported_today: 7.8,
      grid_energy_import_total: 1234.5,
      grid_energy_export_total: 2345.6,
      battery_charge_energy_today: 5.4,
      battery_discharge_energy_today: 4.1,
      battery_charge_energy_total: 4567.8,
      battery_discharge_energy_total: 4321.0,
      emhass_minimum_soc: 5,
      emhass_maximum_soc: 95,
      maximum_export: 15000,
      pause_battery: "off",
      maximum_charge: "off",
      battery_auto: "off",
    };

    function domainForKey(key) {
      if (key === "automatic_control" || key.startsWith("pause_") || key.endsWith("_auto")) return "switch";
      if (["manual_mode", "control_strategy"].includes(key)) return "select";
      if (["manual_power", "emhass_minimum_soc", "emhass_maximum_soc"].includes(key)) return "number";
      if (["optimize_now", "maximum_export", "maximum_charge"].includes(key)) return "button";
      return "sensor";
    }

    function entityIdForKey(key) {
      return `${domainForKey(key)}.gw_ep_${key}`;
    }

    function unitForKey(key) {
      if (key.includes("temperature")) return "°C";
      if (key.includes("voltage")) return "V";
      if (key.includes("current")) return "A";
      if (key.includes("energy")) return "kWh";
      if (key.includes("soc") || key.includes("soh")) return "%";
      if (key.includes("power") || key.includes("setpoint") || key.includes("export")) return "W";
      return undefined;
    }

    function makeState(key, value, revision = 0) {
      const entityId = entityIdForKey(key);
      const unit = unitForKey(key);
      const attributes = {
        friendly_name: key.replaceAll("_", " "),
        ...(unit ? { unit_of_measurement: unit } : {}),
      };
      if (key === "ems_mode") attributes.mode_name = "Battery charge power";
      if (key === "optimize_now") {
        Object.assign(attributes, {
          p_batt_entity: "sensor.p_batt_forecast",
          p_grid_entity: "sensor.p_grid_forecast",
          optim_status_entity: "sensor.optim_status",
          plan_revision: revision,
        });
      }
      if (key === "grid_energy_imported_today" || key === "grid_energy_exported_today") {
        Object.assign(attributes, { last_period: 2.4, accounting_day: "2026-08-27", bootstrap_complete: true });
      }
      return {
        entity_id: entityId,
        state: String(value),
        attributes,
        last_changed: new Date().toISOString(),
        last_updated: new Date().toISOString(),
        last_reported: new Date().toISOString(),
      };
    }

    const registry = ENTITY_KEYS.map((key) => ({
      entity_id: entityIdForKey(key),
      platform: "gw_energypilot",
      config_entry_id: ENTRY_ID,
      unique_id: `${ENTRY_ID}_${key}`,
    }));

    const initialStates = Object.fromEntries(
      ENTITY_KEYS.map((key) => [entityIdForKey(key), makeState(key, stateValues[key] ?? 0)])
    );
    initialStates["sensor.p_batt_forecast"] = makeExternalState("sensor.p_batt_forecast", -1200, "W");
    initialStates["sensor.p_grid_forecast"] = makeExternalState("sensor.p_grid_forecast", 1100, "W");
    initialStates["sensor.optim_status"] = makeExternalState("sensor.optim_status", "Optimal");
    initialStates["sensor.soc_batt_forecast"] = makeExternalState("sensor.soc_batt_forecast", 0.56);
    initialStates["sensor.p_load_forecast"] = makeExternalState("sensor.p_load_forecast", 2500, "W");
    initialStates["sensor.p_pv_forecast"] = makeExternalState("sensor.p_pv_forecast", 4800, "W");

    function makeExternalState(entityId, value, unit) {
      return {
        entity_id: entityId,
        state: String(value),
        attributes: unit ? { unit_of_measurement: unit } : {},
        last_changed: new Date().toISOString(),
        last_updated: new Date().toISOString(),
        last_reported: new Date().toISOString(),
      };
    }

    function batterySaverPayload() {
      const modes = [
        ["mad_steve", "Mad-Steve"],
        ["gold_rush", "Gold Rush"],
        ["balanced", "Balanced"],
        ["battery_saver", "Battery Saver"],
      ].map(([key, label]) => ({ key, label, description: `${label} test profile` }));
      return {
        mode: "balanced",
        modes,
        current_emhass_values: {
          battery_minimum_state_of_charge: 0.05,
          battery_maximum_state_of_charge: 0.95,
          battery_soc_deficit_cost: 0.002,
          battery_soc_surplus_cost: 0.002,
          battery_stress_cost: 0.001,
          weight_battery_charge: 0.001,
          weight_battery_discharge: 0.001,
        },
        emhass_version: "0.18.1",
      };
    }

    function settingsPayload() {
      return {
        selected_entry_id: ENTRY_ID,
        entries: [{
          entry_id: ENTRY_ID,
          title: "GW15K-ETA-G20",
          data: { host: "192.0.2.1", port: 502, slave: 247 },
          options: {
            scan_interval: 15,
            control_strategy: "battery",
            emhass_minimum_soc: 5,
            emhass_maximum_soc: 95,
          },
        }],
      };
    }

    const unknownWsTypes = new Set();
    async function callWS(message) {
      const type = message?.type || "";
      if (type === "config/entity_registry/list") return registry;
      if (type === "gw_energypilot/battery_saver/get") return batterySaverPayload();
      if (type === "gw_energypilot/settings/get") return settingsPayload();
      if (type === "gw_energypilot/battery_price/get") {
        return {
          schema: 4,
          generated_at: new Date().toISOString(),
          plan_revision: 1,
          actual: [],
          historical_plan: [],
          future_plan: [],
          prices: [],
          native_today: { charged: 5.4, discharged: 4.1 },
        };
      }
      if (type === "gw_energypilot/optimization_log/get") return { records: [] };
      if (type === "gw_energypilot/debug_log/get") return { enabled: false, events: [] };
      if (type === "gw_energypilot/smart_meter/get") return { enabled: true, available: true };
      if (type === "gw_energypilot/beta_soc/get") return { on_grid: 5, off_grid: 5 };
      if (type === "gw_energypilot/emhass_sync/get") return { status: "ready" };
      if (type.includes("history") || type.includes("statistics")) return {};
      unknownWsTypes.add(type);
      return {};
    }

    async function callService(domain, service, data) {
      if (domain === "switch" && data?.entity_id) {
        const current = window.__epHass.states[data.entity_id];
        if (current) {
          const next = service === "turn_on" ? "on" : service === "turn_off" ? "off" : current.state;
          window.__epSetEntity(data.entity_id, next);
        }
      }
      return undefined;
    }

    function makeHass(states, language = "en") {
      return {
        states,
        language,
        locale: { language, number_format: "language", time_format: "language" },
        user: { id: "test-user", is_admin: true, name: "Frontend Test" },
        themes: { darkMode: true },
        config: { unit_system: { temperature: "°C" } },
        callWS,
        callService,
        formatEntityState: (stateObj) => `${stateObj.state}${stateObj.attributes?.unit_of_measurement ? ` ${stateObj.attributes.unit_of_measurement}` : ""}`,
      };
    }

    window.confirm = () => true;
    window.__epUnknownWsTypes = unknownWsTypes;
    window.__epHass = makeHass(initialStates);
    window.__epErrors = [];
    window.addEventListener("error", (event) => window.__epErrors.push(String(event.error || event.message)));
    window.addEventListener("unhandledrejection", (event) => window.__epErrors.push(String(event.reason)));

    await import("/custom_components/gw_energypilot/frontend/gw-energy-pilot-v040.js?browser-harness=1");
    await customElements.whenDefined("gw-energypilot-panel");

    const panel = document.createElement("gw-energypilot-panel");
    panel.id = "panel";
    panel.narrow = matchMedia("(max-width: 720px)").matches;
    panel.panel = { config: {} };
    document.getElementById("ha-scroll").appendChild(panel);
    panel.hass = window.__epHass;

    window.__epPanel = panel;
    window.__epScroller = document.getElementById("ha-scroll");
    window.__epSetEntity = (entityId, value, attributes = null) => {
      const previous = window.__epHass.states[entityId] || makeExternalState(entityId, value);
      const nextState = {
        ...previous,
        state: String(value),
        attributes: attributes ? { ...previous.attributes, ...attributes } : previous.attributes,
        last_updated: new Date().toISOString(),
        last_reported: new Date().toISOString(),
      };
      const states = { ...window.__epHass.states, [entityId]: nextState };
      window.__epHass = makeHass(states, window.__epHass.language);
      panel.hass = window.__epHass;
    };
    window.__epTelemetryBurst = async (count = 30, delayMs = 5) => {
      for (let index = 0; index < count; index += 1) {
        const battery = index % 2 === 0 ? -1200 - index : 900 + index;
        window.__epSetEntity(entityIdForKey("battery_power"), battery);
        window.__epSetEntity(entityIdForKey("battery_soc"), 54 + (index % 4));
        window.__epSetEntity(entityIdForKey("pv_total_power"), 4800 + index * 3);
        await new Promise((resolve) => setTimeout(resolve, delayMs));
      }
    };
    window.__epSetLanguage = (language) => {
      window.__epHass = makeHass(window.__epHass.states, language);
      panel.hass = window.__epHass;
    };
    window.__epReady = new Promise((resolve) => {
      const wait = () => {
        if (panel.shadowRoot?.querySelector(".ep-dashboard-layout")) resolve(true);
        else requestAnimationFrame(wait);
      };
      wait();
    });
  </script>
</body>
</html>
