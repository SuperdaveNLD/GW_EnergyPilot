name: Promote v0.38 release metadata

on:
  push:
    branches:
      - fix/v038-controls-and-flow

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out v0.38 branch
        uses: actions/checkout@v4
        with:
          ref: fix/v038-controls-and-flow
          fetch-depth: 0

      - name: Promote release metadata
        run: python scripts/promote_v038_release.py

      - name: Commit promoted release files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "v0.38 metadata already promoted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            custom_components/gw_energypilot/frontend/gw-energy-pilot-v038-runtime.js \
            docs/FRONTEND_CONTROL_REBUILD.md \
            CHANGELOG.md \
            docs/RELEASE_NOTES.md \
            README.md \
            AGENTS.md \
            docs/ARCHITECTURE.md
          git commit -m "Promote GW EnergyPilot v0.38 release metadata"
          git push origin HEAD:fix/v038-controls-and-flow
