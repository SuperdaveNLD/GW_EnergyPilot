name: Frontend architecture audit

on:
  push:
    branches:
      - fix/frontend-stability-v041
      - fix/mobile-touch-controls-v042
      - codex/release-v0.48
      - codex/release-v0.49
  pull_request:
    paths:
      - "custom_components/gw_energypilot/frontend/**"
      - "custom_components/gw_energypilot/__init__.py"
      - "scripts/audit_frontend.py"
      - ".github/workflows/frontend-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Audit active frontend graph
        run: |
          python scripts/audit_frontend.py \
            --json frontend-audit.json \
            --markdown frontend-audit.md

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-architecture-audit
          path: |
            frontend-audit.json
            frontend-audit.md
