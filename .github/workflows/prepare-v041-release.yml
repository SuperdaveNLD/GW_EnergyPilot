          release_notes_v041 = """# GW EnergyPilot v0.41 Beta

v0.41 is the frontend stability release requested after repeated mobile scroll and control failures. It changes the active dashboard render architecture rather than adding another visual or pointer patch.

## Operator-visible behavior

- The dashboard remains scrollable while GoodWe and EMHASS telemetry updates arrive.
- The Dashboard menu, Automatic Control button and Battery Strategy buttons keep the same DOM identity during ordinary telemetry updates.
- Selecting a Battery Strategy updates only the strategy section while the existing Battery Saver API applies the mode and starts the established optimization/publish transaction.
- A changed EMHASS plan refreshes only the Battery · Plan · Price card. The rest of the dashboard is not rebuilt.
- EnergyPilot animations, transitions, moving flow particles and modal backdrop filters are disabled. Static direction/state labels remain available.

## Stable-DOM architecture

The active entrypoint is `gw-energy-pilot-v041.js`.

Normal telemetry follows this path:

1. accept the new Home Assistant `hass` object;
2. compare context and structural signatures;
3. when structure is unchanged, batch a small live patch;
4. update existing text, classes, attributes, slider values, status pills, diagnostics and meter widths;
5. leave `main`, cards and interactive controls connected.

A full render remains valid only for:

- first panel initialization;
- Home Assistant language, user or theme changes;
- entity-registry changes;
- optional-card topology changes, such as PV4 becoming structurally present/absent;
- an explicit layout/narrow-mode structural change.

The inherited v0.38 pointer/render guard and mobile scroll snapshot restoration remain available to historical v0.38-v0.40 entrypoints. The active v0.41 runtime explicitly bypasses them. It does not write an old `scrollTop` back during a pan or momentum scroll.

## Scoped refresh ownership

### Battery Strategy

`gw-energy-pilot-v038-strategy.js` uses a v0.41 callback to rerender only `.ep-v038-strategy` for loading, pending, success/error and Custom-SOC feedback. Older entrypoints retain the existing full-render fallback.

### Battery · Plan · Price

`gw-energy-pilot-v027-battery-plan-data.js` and `gw-energy-pilot-v027-battery-plan-core.js` expose a targeted graph-card refresh. A loading flag and active-promise check form one busy state, preventing re-entrant refresh while a request is being registered.

## Motion policy

v0.41 intentionally enforces a no-motion dashboard:

- zero active EnergyPilot CSS animations;
- zero active EnergyPilot CSS transitions;
- no moving flow particle layers;
- no animated pseudo-elements;
- no modal backdrop filters;
- `scroll-behavior: auto` for EnergyPilot-owned content.

This policy is applied to initial content and late-added strategy, graph and modal content.

## Browser validation

The release matrix runs the exact v0.41 entrypoint in real browser engines:

| Profile | Engine | Viewport / input |
|---|---|---|
| Desktop | Chromium | 1440 × 900, mouse/keyboard |
| iPad | WebKit | 834 × 1112, mobile + touch |
| iPhone | WebKit | 390 × 844, mobile + touch |

Each profile verifies:

- sufficient page scroll range;
- no idle scroll drift during telemetry;
- no backward samples while telemetry arrives during a controlled scroll;
- stable `main`, layout-button, Automatic Control and Battery Strategy nodes;
- Dashboard menu open/close using native browser clicks;
- Automatic Control OFF and ON actions;
- Battery Strategy apply;
- changed plan data and replacement of only the graph card;
- Dutch structural localization followed by stable telemetry;
- controls after a deliberate structural rerender;
- zero active EnergyPilot animations/transitions;
- no JavaScript/page errors;
- no unknown WebSocket calls.

These are browser-engine/viewport regressions, not a claim of broad physical-device, firmware or Home Assistant Companion App validation. That wider field validation remains part of the Beta status.

## Upgrade notes

1. Install v0.41 through HACS after the release is published.
2. Restart Home Assistant as requested by HACS.
3. Reload the dashboard/browser so the new `0.41-stable1` frontend cache keys are used.
4. Verify scrolling and the Dashboard menu before enabling Automatic Control.
5. Confirm Battery Strategy and Optimize now update the plan graph without moving the page.

## Safety and compatibility

v0.41 is frontend-only. It does not change:

- GoodWe register definitions or Modbus read blocks;
- EMS modes, setpoints or write ordering;
- Automatic Control decisions;
- EMHASS optimization/configuration ownership;
- entity IDs or unique IDs;
- config-entry data or migrations;
- persistent Store keys;
- stable device identity.
"""
          write(ROOT / "docs" / "RELEASE_NOTES_V041.md", release_notes_v041)

          architecture = """# Frontend stable-DOM architecture

## Status

This document is the canonical frontend render/interaction decision for **GW EnergyPilot v0.41 Beta**. It supersedes the normal telemetry/render behavior documented for v0.38-v0.40 while preserving those older modules for backwards-compatible historical entrypoints.

No GoodWe register, Modbus, EMS or EMHASS backend behavior is defined here.

## Problem statement

The inherited base panel builds its complete ShadowRoot with `innerHTML`. Older release layers filtered and batched relevant Home Assistant updates, but an accepted update still ran the complete render chain. That detached and recreated cards and controls while WebKit could simultaneously be processing a touch pan or momentum scroll.

The v0.38-v0.40 stack attempted to compensate with interaction guards, delayed renders, button reuse, scroll snapshots/restoration and transition suppression. Those mechanisms reduced individual symptoms but could not make a destructive telemetry render equivalent to a stable page.

## Active entrypoint chain

```text
Home Assistant PANEL_MODULE
  -> gw-energy-pilot-v041.js?v=0.41-stable1
  -> gw-energy-pilot-v039.js?v=0.41-stable1
  -> gw-energy-pilot-v038.js?v=0.41-stable1
  -> gw-energy-pilot-v038-runtime.js?v=0.41-stable1
  -> gw-energy-pilot-v038-strategy.js?v=0.41-stable1
```

The v0.41 entrypoint also imports the modified plan data/core modules with `0.41-stable1` cache keys. This is required because module/HTTP cache identity is URL-based; a new top-level file alone is insufficient when modified nested modules retain a v0.40 URL.

## Render ownership

### 1. Initial structural render

The inherited complete renderer is allowed when the panel is first created or entity discovery has not completed. All cards, controls and inherited feature layers are built normally.

### 2. Context/structure render

A complete render is allowed when the DOM structure or presentation context genuinely changes:

- Home Assistant language/locale;
- Home Assistant user/admin context;
- theme/dark-mode context;
- entity-registry mapping;
- optional-card topology, including PV4 structural visibility;
- explicit narrow/layout structural changes.

After that render, v0.41 re-establishes its stable marker, targeted callbacks and no-motion policy.

### 3. Normal telemetry patch

When context and structure signatures are unchanged, the `hass` setter does **not** queue the inherited complete render. It batches a live patch and mutates existing nodes:

- power/SOC/energy text;
- status and direction classes;
- EMS/controller/EMHASS metrics;
- slider values when the user is not actively editing them;
- SOC-bar width;
- diagnostics rows;
- live-flow semantic labels and static direction attributes;
- thermal/system-health values.

The existing `main`, cards and controls remain connected.

### 4. Battery Strategy refresh

Loading, pending, success/error and Custom-SOC feedback rerender only `.ep-v038-strategy`. A delegated listener on the persistent ShadowRoot remains the action owner. Stable backend mode keys, not translated labels, remain the control identity.

### 5. Plan graph refresh

A changed `plan_revision` or configured `P_batt` state invalidates graph data. Only `.ep-v027-battery-plan-card` is replaced. Layout, Automatic Control, Battery Strategy and other cards retain identity.

## Native interaction and scroll contract

The active v0.41 normal telemetry path:

- never writes `scrollTop` or `scrollLeft`;
- never captures a touch pointer;
- never cancels a vertical pan with `preventDefault`;
- never delays telemetry because a pointer merely hovers;
- never restores an earlier viewport snapshot;
- never reuses a detached control node to compensate for a full telemetry render.

The Home Assistant browser/WebView exclusively owns pan and momentum scrolling.

The legacy v0.38 interaction and scroll-restoration functions remain in their module for older entrypoints, but `__epV041StableRuntime` bypasses them before they are installed or used.

## Motion contract

Reliability is the v0.41 priority. EnergyPilot-owned content has:

- no CSS animations;
- no CSS transitions;
- no moving flow particles;
- no animated pseudo-elements;
- no modal backdrop filters;
- automatic rather than smooth EnergyPilot scrolling behavior.

The rule is applied after complete renders and after scoped strategy/graph/modal updates. The dashboard animation preference remains visible for backwards-compatible storage but is disabled in the v0.41 UI.

## Required invariants

A normal telemetry burst must satisfy all of these:

1. `main` object identity is unchanged.
2. Dashboard layout-button identity is unchanged.
3. Automatic Control button identity is unchanged.
4. Battery Strategy button identity is unchanged.
5. Idle scroll delta is at most two pixels.
6. A controlled downward scroll has no backward samples.
7. No JavaScript/page error is emitted.
8. No unknown EnergyPilot WebSocket request is emitted.
9. Computed active EnergyPilot animation count is zero.
10. Computed active EnergyPilot transition count is zero.

A plan refresh may replace the graph card but none of items 1-4.

## Regression matrix

The required CI matrix is implemented in `tests/browser/test_frontend_stability.py` and selected for v0.41 by `tests/browser/test_frontend_stability_v041.py`:

- desktop Chromium, 1440 × 900;
- iPad WebKit touch, 834 × 1112;
- iPhone WebKit touch, 390 × 844.

The browser workflow is a release gate together with Quality, frontend architecture audit, HACS and Hassfest.

## Contributor rules

- Do not call `_queueRender()` for normal v0.41 telemetry feedback when an existing scoped callback can update the owner section/card.
- Do not add scroll-position writes as a visual correction for render movement.
- Do not add pointer capture or global gesture cancellation to protect a control from telemetry.
- Do not re-enable motion without a separately documented ownership model and browser regressions on all three profiles.
- Preserve entity IDs, unique IDs, settings, backend APIs and GoodWe/EMHASS semantics unless a separate change explicitly requires them.
"""
          write(ROOT / "docs" / "FRONTEND_STABLE_DOM.md", architecture)

          test_v040 = """from pathlib import Path
import json
import unittest


ROOT = Path(__file__).resolve().parents[1]
INTEGRATION = ROOT / "custom_components" / "gw_energypilot"
FRONTEND = INTEGRATION / "frontend"


class FrontendV040RenderSettleTests(unittest.TestCase):
    def setUp(self) -> None:
        self.source = (FRONTEND / "gw-energy-pilot-v040.js").read_text(
            encoding="utf-8"
        )

    def test_v040_remains_historical_while_v041_is_active(self) -> None:
        manifest = json.loads((INTEGRATION / "manifest.json").read_text(encoding="utf-8"))
        init_source = (INTEGRATION / "__init__.py").read_text(encoding="utf-8")
        v041 = (FRONTEND / "gw-energy-pilot-v041.js").read_text(encoding="utf-8")
        v039 = (FRONTEND / "gw-energy-pilot-v039.js").read_text(encoding="utf-8")
        v038 = (FRONTEND / "gw-energy-pilot-v038.js").read_text(encoding="utf-8")
        self.assertEqual(manifest["version"], "0.41")
        self.assertIn("gw-energy-pilot-v041.js?v=0.41-stable1", init_source)
        self.assertIn('const VERSION = "0.41"', v041)
        self.assertIn('import "./gw-energy-pilot-v039.js?v=0.41-stable1"', v041)
        self.assertIn('import "./gw-energy-pilot-v038.js?v=0.41-stable1"', v039)
        self.assertIn(
            'import "./gw-energy-pilot-v038-runtime.js?v=0.41-stable1"', v038
        )
        self.assertIn('const VERSION = "0.40"', self.source)
        self.assertIn('import "./gw-energy-pilot-v039.js?v=0.40-mobile-scroll1"', self.source)

    def test_render_settle_covers_dashboard_and_window_controls(self) -> None:
        self.assertIn("const INTERACTIVE_SELECTOR", self.source)
        self.assertIn("button:not(.ep-v038-profile)", self.source)
        self.assertIn("[data-card-control]", self.source)
        self.assertIn(".ep-layout-button", self.source)
        self.assertIn(".ep-menu-close", self.source)
        self.assertIn(".ep-menu-reset", self.source)
        self.assertIn(".ep-v028-control", self.source)
        self.assertIn(".ep-v031-control", self.source)
        self.assertIn("::before", self.source)
        self.assertIn("::after", self.source)

    def test_settle_rule_is_transition_only_and_survives_full_render(self) -> None:
        self.assertIn("transition:none !important", self.source)
        self.assertNotIn("animation:none", self.source)
        self.assertIn("adoptedStyleSheets", self.source)
        self.assertIn("CSSStyleSheet", self.source)
        self.assertIn("this.style.setProperty(SETTLE_CUSTOM_PROPERTY", self.source)
        self.assertIn("scheduleSettleRelease(this)", self.source)
        self.assertLess(
            self.source.index("beginSettle(this)"),
            self.source.index("previousRender.apply(this, args)"),
        )

    def test_release_is_tied_to_painted_frames_not_timeouts(self) -> None:
        self.assertIn("requestAnimationFrame", self.source)
        self.assertIn("generation !== panel.__epV040SettleGeneration", self.source)
        self.assertNotIn("setTimeout", self.source)
        self.assertNotIn("pointerdown", self.source)
        self.assertNotIn("pointermove", self.source)
        self.assertNotIn("preventDefault", self.source)
        self.assertNotIn("setPointerCapture", self.source)
        self.assertNotIn("scrollTop", self.source)
        self.assertNotIn("scrollLeft", self.source)
        self.assertNotIn("_queueRender", self.source)

    def test_v040_has_dedicated_release_notes(self) -> None:
        notes = (ROOT / "docs" / "RELEASE_NOTES_V040.md").read_text(
            encoding="utf-8"
        )
        self.assertIn("GW EnergyPilot v0.40 Beta", notes)
        self.assertIn("full ShadowRoot", notes)
        self.assertIn("transitions", notes)
        self.assertIn("Live-flow animations remain", notes)


if __name__ == "__main__":
    unittest.main()
