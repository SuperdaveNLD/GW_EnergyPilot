name: Prepare v0.41 release metadata

on:
  push:
    branches:
      - fix/frontend-stability-v041
    paths:
      - ".github/workflows/prepare-v041-release.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: fix/frontend-stability-v041
          fetch-depth: 0

      - name: Patch v0.41 release files
        run: python .github/scripts/prepare_v041_release.py

      - name: Commit release preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Release files already prepared."
            exit 0
          fi
          git commit -m "Prepare v0.41 stable frontend release"
          git push origin HEAD:fix/frontend-stability-v041
