name: Quality

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Promote v0.38 release metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/v038-controls-and-flow' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/promote_v038_release.py
          if git diff --quiet; then
            echo "v0.38 metadata already promoted."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              custom_components/gw_energypilot/frontend/gw-energy-pilot-v038-runtime.js \
              docs/FRONTEND_CONTROL_REBUILD.md \
              CHANGELOG.md \
              docs/RELEASE_NOTES.md \
              README.md \
              AGENTS.md \
              docs/ARCHITECTURE.md
            git commit -m "Promote GW EnergyPilot v0.38 release metadata"
            git push origin HEAD:fix/v038-controls-and-flow
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile Python sources
        run: python -m compileall -q custom_components/gw_energypilot scripts tests

      - name: Validate frontend JavaScript
        run: |
          node --check custom_components/gw_energypilot/frontend/gw-energy-pilot-v038-model.js
          node --check custom_components/gw_energypilot/frontend/gw-energy-pilot-v038-styles.js
          node --check custom_components/gw_energypilot/frontend/gw-energy-pilot-v038-strategy.js
          node --check custom_components/gw_energypilot/frontend/gw-energy-pilot-v038-runtime.js
          node --check custom_components/gw_energypilot/frontend/gw-energy-pilot-v038.js
          node tests/test_frontend_v038.mjs
          node tests/test_frontend_v038_controls.mjs

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate repository invariants
        run: python scripts/validate_repo.py
