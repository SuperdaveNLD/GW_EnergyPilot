name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile Python sources
        run: python -m compileall -q custom_components/gw_energypilot scripts tests

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Run frontend runtime tests
        run: node --test tests/frontend_v036_runtime.mjs

      - name: Validate repository invariants
        run: python scripts/validate_repo.py
