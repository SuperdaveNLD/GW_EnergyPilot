name: Prepare v0.41.1 documentation

on:
  push:
    branches:
      - fix/v041-optimize-scroll

permissions:
  contents: write

jobs:
  prepare-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/v041-optimize-scroll
          fetch-depth: 0

      - name: Prepare documentation
        run: python scripts/prepare_v0411_docs.py

      - name: Commit documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document v0.41.1 optimize scroll hotfix"
          git push origin HEAD:fix/v041-optimize-scroll
