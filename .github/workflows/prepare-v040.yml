name: Prepare v0.40

# Temporary branch-only preparer; removed before the release PR.
on:
  push:
    branches:
      - release/v0.40
    paths:
      - .github/workflows/prepare-v040.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.40

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare v0.40 release files
        run: python scripts/prepare_v040.py

      - name: Validate v0.40 candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/gw_energypilot scripts tests
          node --check custom_components/gw_energypilot/frontend/gw-energy-pilot-v040.js
          node --check custom_components/gw_energypilot/frontend/gw-energy-pilot-v039.js
          node --check custom_components/gw_energypilot/frontend/gw-energy-pilot-v038-model.js
          node --check custom_components/gw_energypilot/frontend/gw-energy-pilot-v038-styles.js
          node --check custom_components/gw_energypilot/frontend/gw-energy-pilot-v038-strategy.js
          node --check custom_components/gw_energypilot/frontend/gw-energy-pilot-v038-i18n.js
          node --check custom_components/gw_energypilot/frontend/gw-energy-pilot-v038-runtime.js
          node --check custom_components/gw_energypilot/frontend/gw-energy-pilot-v038.js
          node tests/test_frontend_v038.mjs
          node tests/test_frontend_v038_controls.mjs
          node tests/test_frontend_v038_i18n.mjs
          python -m unittest discover -s tests -v
          python scripts/validate_repo.py

      - name: Commit prepared release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/gw_energypilot/frontend/gw-energy-pilot-v040.js
          git add custom_components/gw_energypilot/manifest.json
          git add custom_components/gw_energypilot/__init__.py
          git add .github/workflows/quality.yml
          git add tests/test_frontend_v040_render_settle.py
          git add CHANGELOG.md
          git add docs/RELEASE_NOTES.md
          git add docs/RELEASE_NOTES_V040.md
          git add README.md
          git add AGENTS.md
          git add docs/FRONTEND_CONTROL_REBUILD.md
          git commit -m "Prepare GW EnergyPilot v0.40 Beta"
          git push origin HEAD:release/v0.40
