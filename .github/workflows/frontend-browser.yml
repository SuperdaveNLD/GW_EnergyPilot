name: Frontend browser stability

on:
  push:
    branches:
      - beta
      - main
  pull_request:
    paths:
      - "custom_components/gw_energypilot/frontend/**"
      - "custom_components/gw_energypilot/__init__.py"
      - "tests/browser/**"
      - ".github/workflows/frontend-browser.yml"

permissions:
  contents: read

jobs:
  browser-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/browser/requirements.txt

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium webkit

      - name: Run desktop, iPad and iPhone touch-control diagnostics
        run: python tests/browser/test_frontend_stability_v130.py

      - name: Upload browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-stability
          path: frontend-browser-results.json
          if-no-files-found: warn
